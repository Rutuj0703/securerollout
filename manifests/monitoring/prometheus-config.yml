kind: ConfigMap
apiVersion: v1
metadata:
  name: prometheus-config
  namespace: demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'analysis-runner'
        static_configs:
          - targets: ['analysis-runner.demo.svc.cluster.local:8081']
      - job_name: 'argo-rollouts'
        static_configs:
          - targets: ['argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090']
