kind: Application
apiVersion: argoproj.io/v1alpha1
metadata:
  name: securerollout-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rutuj0703/securerollout.git
    targetRevision: main
    path: manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy: 
    automated:
      selfHeal: true
      prune: true

