kind: Rollout
apiVersion: argoproj.io/v1alpha1
metadata:
  name: target-app
  namespace: demo
spec:
  replicas: 5
  strategy:
    canary:
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: security-check
            args:
              - name: image-digest
                value: "rutujkoli/target-app@sha256:4521f8d2ae75a88d1f98ce55e8b015bf1ef5867a7bfb3a819a45ed3244cc737f"
              - name: namespace
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: pod-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
        - name: target-app
          image: rutujkoli/target-app@sha256:4521f8d2ae75a88d1f98ce55e8b015bf1ef5867a7bfb3a819a45ed3244cc737f
          ports:
          ports:
          -  containerPort: 8080
      
