name: CD - Build, Scan, Sign, Deploy target-app

on:
  push:
    branches: [main]
    paths:
      - 'services/target-app/**'

permissions:
  contents: write
  id-token: write

jobs:
  build-scan-sign-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./services/target-app
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/target-app:latest

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image by digest
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            ${{ secrets.DOCKERHUB_USERNAME }}/target-app@${{ steps.build.outputs.digest }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest (keyless)
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/target-app@${{ steps.build.outputs.digest }}

      - name: Update manifests with new digest
        run: |
          NEW_REF="${{ secrets.DOCKERHUB_USERNAME }}/target-app@${{ steps.build.outputs.digest }}"
          sed -i "s|${{ secrets.DOCKERHUB_USERNAME }}/target-app@sha256:[a-f0-9]*|${NEW_REF}|g" manifests/rollout.yml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/rollout.yml
          git diff --staged --quiet || git commit -m "CI: deploy target-app@${{ steps.build.outputs.digest }} (commit ${{ github.sha }})"
          git push
